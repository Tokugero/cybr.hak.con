services:
  qdrant:
    # Pinned to the latest 1.17.x to match the qdrant-client>=1.9,<2 pin in
    # lib/pyproject.toml. v1.17.1 looked up on Docker Hub 2026-05-10.
    image: qdrant/qdrant:v1.17.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    # Latest stable looked up on Docker Hub 2026-05-10.
    image: ollama/ollama:0.23.2
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ingest:
    build: ./lib
    profiles: [ingest]
    depends_on:
      - qdrant
      - ollama
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      HACKTRICKS_REPO_URL: ${HACKTRICKS_REPO_URL:-}
      HACKTRICKS_PATH: /data/hacktricks
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hacktricks}
      VECTOR_SIZE: ${VECTOR_SIZE:-768}
    volumes:
      - hacktricks-data:/data

volumes:
  qdrant-data:
  ollama-data:
  hacktricks-data:
