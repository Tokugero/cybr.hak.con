[project]
name = "rag-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=2.0,<3",
  "pydantic>=2.9,<3",
  "rag-lib",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.uv.sources]
rag-lib = { workspace = true }
